[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "device-test-lab"
version = "0.1.0"
description = "Lease-based scheduling core for self-hosted test devices"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "linyup"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3"
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[project.scripts]
device-lab-api = "device_lab.api:run"
device-lab-agent = "device_lab.agent:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
device_lab = ["static/*"]
